name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Unit tests
        run: node tests/test.js
      - name: Validate markers
        run: python3 tools/validate.py
      - name: Verify PMIDs against PubMed
        run: python3 tools/verify_pmids.py
      - name: No real genomes committed
        run: |
          if git ls-files | grep -iE '(genome_|ancestrydna|myheritage|\.vcf|\.bcf)' | grep -v synthetic; then
            echo "Raw genome file detected"; exit 1; fi
      - name: No external URLs in app code
        run: |
          if grep -nE 'src="https?:|href="https?:[^"]*\.(js|css)|fetch\(|XMLHttpRequest|sendBeacon' index.html app.js core.js; then
            echo "External request found"; exit 1; fi
